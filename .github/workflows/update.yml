name: Cartel Auto Refresh

on:
  schedule:
    - cron: '0 * * * *'        # Runs every 1 hour (at the start of the hour)
  workflow_dispatch:           # Adds a "Run workflow" button for Manual Refresh
  push:
    branches:
      - main

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Required for the bot to push the update
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl

      - name: Run Update Script
        run: php update.php

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo "No changes found, skipping commit."
          else
            git commit -m "Auto-Update: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
