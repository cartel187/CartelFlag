name: Update Playlist

on:
  schedule:
    - cron: '0 * * * *' # Every 1 hour
  workflow_dispatch: # Allows Manual Refresh button from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Update Script
        run: node update_playlist.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Cartel-Bot"
          git config --global user.email "bot@cartel.live"
          git add playlist.m3u
          git commit -m "📊 Auto-Update: $(date)" || echo "No changes to commit"
          git push
